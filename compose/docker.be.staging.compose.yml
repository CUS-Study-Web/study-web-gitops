services:
  app:
    image: ghcr.io/cus-study-web/backend:staging
    container_name: studyweb-backend-staging
    env_file:
      - backend.env
    ports:
      - "${BACKEND_PORT_STAGING}:${SERVER_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_SERVER_STAGING}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER} 
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST_STAGING}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
    restart: unless-stopped
    networks: 
      - studyweb-network

networks:
  studyweb-network:
    external: true

