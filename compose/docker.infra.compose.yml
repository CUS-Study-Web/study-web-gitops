services:
  postgres:
    container_name: studyweb-postgres
    build: 
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGBACKREST_REPO1_S3_KEY: ${S3_ACCESS_KEY_STAGING}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${S3_SECRET_KEY_STAGING}
      PGBACKREST_REPO1_S3_BUCKET: ${S3_BUCKET_STAGING}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    restart: unless-stopped
    networks:
      - studyweb-network
      
  redis:
    image: docker.io/library/redis:8-alpine
    container_name: studyweb-redis
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - studyweb-network

networks:
  studyweb-network:
    external: true

volumes:
  postgres_data: