worker_processes auto;

pid /home/cus-server/.config/systemd/user/git-ops/nginx/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 50M;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    upstream backend_prod {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    upstream backend_staging {
        server 127.0.0.1:58888;
        keepalive 32;
    }

    log_format api_log
        '$remote_addr '
        'trace_id=$request_id '
        '"$request" '
        'status=$status '
        'request_time=$request_time '
        'upstream_status=$upstream_status '
        'upstream_response_time=$upstream_response_time '
        'body_bytes_sent=$body_bytes_sent '
        'user_agent="$http_user_agent"';

    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location /staging/ {
            limit_req zone=api_limit burst=25 nodelay;

            access_log /home/cus-server/.config/systemd/user/git-ops/nginx/logs/staging-access.log api_log;
            error_log /home/cus-server/.config/systemd/user/git-ops/nginx/logs/staging-error.log error;

            proxy_pass http://backend_staging/;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location / {
            limit_req zone=api_limit burst=25 nodelay;

            access_log /home/cus-server/.config/systemd/user/git-ops/nginx/logs/prod-access.log api_log;
            error_log /home/cus-server/.config/systemd/user/git-ops/nginx/logs/prod-error.log error;

            proxy_pass http://backend_prod;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}